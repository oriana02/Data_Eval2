services:
  # ── BASE DE DATOS (standalone para pruebas locales) ────────
  # En producción la BD la levanta Back_EVAL2.
  # Este compose sirve para probar los scripts SQL de forma aislada.
  db:
    image: mysql:8.0
    container_name: proyecto_db_local
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql
      - ./01_creacion_base_datos.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    ports:
      # Expone 3306 al host para conectar con MySQL Workbench
      - "3306:3306"

    networks:
      - db_local_net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${DB_USER}",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
    driver: local

networks:
  db_local_net:
    driver: bridge
