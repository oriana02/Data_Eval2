services:
  # ── Servicio de Base de Datos MySQL ──────────────────────────
  database:
    image: mysql:8.0
    container_name: proyecto_mysql
    restart: unless-stopped

    # ── Variables de entorno para inicializar la BD ────────────
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: proyecto_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    # ── Persistencia + script de inicialización ────────────────
    volumes:
      # Guarda los datos aunque el contenedor se elimine
      - mysql_data:/var/lib/mysql

      # Script que se ejecuta SOLO la primera vez
      - ./01_creacion_base_datos.sql:/docker-entrypoint-initdb.d/init.sql

    # ── Red compartida para comunicación con backend ───────────
    networks:
      - innovatech-net

# ── Red externa (debe existir previamente) ─────────────────────
networks:
  innovatech-net:
    external: true

# ── Volumen para persistencia de datos ─────────────────────────
volumes:
  mysql_data:
